name: Build ChristieControl

on:
  workflow_dispatch:        # bouton "Run workflow" dans l'onglet Actions
  push:
    tags: ["v*"]            # ou : git tag v1.0 && git push --tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            extra: --onefile --icon icon.ico
            out: dist/ChristieControl.exe
          - os: macos-latest        # Apple Silicon (M1/M2/M3...)
            name: macos-apple-silicon
            extra: --icon icon.icns
            out: dist/ChristieControl-macos-apple-silicon.zip
          - os: macos-13-intel      # Mac Intel (MacBook Pro 2017...)
            name: macos-intel
            extra: --icon icon.icns
            out: dist/ChristieControl-macos-intel.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --windowed --name ChristieControl ${{ matrix.extra }} app.py
      - name: Zip de l'app macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/ChristieControl.app ${{ matrix.out }}
      - uses: actions/upload-artifact@v6
        with:
          name: ChristieControl-${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error
