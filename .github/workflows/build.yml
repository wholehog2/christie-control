name: Build ChristieControl

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            extra: --onefile
          - os: macos-15-intel
            name: macos-intel
            extra: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --windowed --name ChristieControl ${{ matrix.extra }} app.py
      - name: Zip de l'app macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/ChristieControl.app dist/ChristieControl-macos.zip
      - uses: actions/upload-artifact@v5
        with:
          name: ChristieControl-${{ matrix.name }}
          path: |
            dist/ChristieControl.exe
            dist/ChristieControl-macos.zip
          if-no-files-found: error
